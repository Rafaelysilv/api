<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA DE CADASTRO -->
    <section id="telaCadastro" class="tela">

        <div class="card">

            <h1>Cadastrar perfil</h1>

            <p class="descricao">
                Adicione um nome e uma foto.
            </p>

            <div class="campo">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome"
                >
            </div>

            <div class="campo">

                <label>Foto</label>

                <label class="upload">
                    <span id="textoUpload">
                        📷 Escolher imagem
                    </span>

                    <input
                        type="file"
                        id="foto"
                        accept="image/*"
                    >

                    <img
                        id="preview"
                        alt="Preview"
                    >
                </label>

            </div>

            <button
                id="btnCadastrar"
                class="btn principal"
            >
                Cadastrar
            </button>

            <button
                id="btnVerPerfis"
                class="btn secundario"
            >
                Ver perfis cadastrados
            </button>

        </div>

    </section>

    <!-- TELA DE PERFIS -->
    <section id="telaPerfis" class="tela escondida">

        <div class="container">

            <div class="cabecalho">

                <h1>Perfis cadastrados</h1>

                <button
                    id="btnVoltar"
                    class="btn voltar"
                >
                    Voltar
                </button>

            </div>

            <div
                id="listaPerfis"
                class="lista"
            >
            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
